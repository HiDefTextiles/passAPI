<!DOCTYPE html>
<html lang="is">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Set Up Wi-Fi</title>
	<link rel="stylesheet" href="./styles.css">

</head>

<body>
	<main class="grid">
		<a href="/" class="button borderItem" style="grid-row: 1;grid-column: 1;">
			<h2>Til baka 🏡</h2>
		</a>

		<!-- <div class="container" style="grid-column: 1 / 6;grid-row: 2/5;height: 100%;"> -->
		<h2 style="grid-row:1;grid-column: 3;">Connect Kiosk to Wi-Fi</h2>
		<form id="wifiForm"
			style="grid-row:3/4;grid-column:1/6;height: 240px;width: 100%;display: grid;grid-template-columns: 1fr;grid-template-rows: 1fr 1fr 1fr;">
			<input type="text" id="ssid" placeholder="Wi-Fi Network Name (SSID)" required>
			<input type="password" id="password" placeholder="Password" required>
			<button type="submit" class="button buttonGo">Connect</button>
		</form>
		<p id="status" style="grid-column: 4/6;grid-row: 1;"></p>
		<!-- </div> -->
	</main>

	<script>
		const wifiForm = document.getElementById('wifiForm');
		const status = document.getElementById('status');

		wifiForm.addEventListener('submit', async (event) => {
			event.preventDefault();
			const ssid = document.getElementById('ssid').value;
			const password = document.getElementById('password').value;

			status.textContent = 'Connecting... Please wait.';

			try {
				const response = await fetch('/api/set-wifi', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ ssid, password })
				});

				const result = await response.json();

				if (response.ok) {
					status.textContent = result.message + ' The device will now reboot.';
				} else {
					throw new Error(result.message);
				}
			} catch (error) {
				status.textContent = `Error: ${error.message}`;
			}
		});
	</script>
</body>

</html>
