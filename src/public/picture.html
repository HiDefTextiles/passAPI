<!DOCTYPE html>
<html lang="is">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>

<body>
	<style>
		.controls {
			margin-bottom: 1rem;
		}

		.controls button {
			font-size: 1.5rem;
			width: 40px;
			height: 40px;
			cursor: pointer;
		}
	</style>
	<div class="controls">
		<button id="zoomOut" title="Decrease size">-</button>
		<button id="zoomIn" title="Increase size">+</button>
	</div>
	<div id="imagePreview"></div>
</body>
<script>
	// 2. DEFINE STATE VARIABLES to hold the size and matrix data
	let pixelSize = 2; // Initial size in pixels
	let currentMatrix = []; // To store the matrix data so we can re-render it

	/**
	 * Reverses the process of separateColors by first grouping sparse rows
	 * that belong to the same original row and then merging each group.
	 * This is a more robust two-pass approach.
	 * @param {number[][]} separatedMatrix - The matrix generated by separateColors.
	 * @returns {number[][]} The original matrix.
	 */
	/**
	 * Reverses the color separation and duplication process.
	 * Step 1: Filters out duplicate rows.
	 * Step 2: Groups the remaining sparse color rows that belong together.
	 * Step 3: Combines each group into a single, dense, multi-color row.
	 *
	 * @param {number[][]} separatedMatrix - The matrix generated by the separation process.
	 * @returns {number[][]} The fully reconstructed original matrix.
	 */
	function recombineColors(separatedMatrix) {
		// Return early if the input is empty.
		if (!separatedMatrix || separatedMatrix.length === 0) {
			return [];
		}

		const numCols = separatedMatrix[0].length;

		// --- STEP 1: De-duplicate the matrix ---
		// This reverses the "*2" part of the process by keeping every other row.
		const deduplicatedMatrix = separatedMatrix.filter((_, index) => index % 2 === 0);

		// --- STEP 2: Group the remaining sparse rows ---
		const rowGroups = [];
		if (deduplicatedMatrix.length > 0) {
			let currentGroup = [];
			let colorsInGroup = new Set();

			for (const sparseRow of deduplicatedMatrix) {
				// Find the color in the current sparse row.
				const color = sparseRow.find(value => value !== 0);

				// Skip any empty rows (all zeros).
				if (!color) {
					continue;
				}

				// If this color is already in our current group, it means we've
				// finished the previous original row and are starting a new one.
				if (colorsInGroup.has(color)) {
					rowGroups.push(currentGroup); // Save the completed group.
					currentGroup = [];             // Start a new group.
					colorsInGroup.clear();         // Reset the color tracker.
				}

				// Add the sparse row and its color to the group we're building.
				currentGroup.push(sparseRow);
				colorsInGroup.add(color);
			}

			// Add the very last group after the loop finishes.
			if (currentGroup.length > 0) {
				rowGroups.push(currentGroup);
			}
		}

		// --- STEP 3: Combine each group into a final, dense row ---
		const finalMatrix = [];
		for (const group of rowGroups) {
			const combinedRow = new Array(numCols).fill(0);
			// "Paint" each sparse row from the group onto the combinedRow canvas.
			for (const sparseRow of group) {
				for (let c = 0; c < numCols; c++) {
					if (sparseRow[c] !== 0) {
						combinedRow[c] = sparseRow[c];
					}
				}
			}
			finalMatrix.push(combinedRow);
		}

		return finalMatrix;
	}
	/**
	 * Tekið úr vefforitun 1 hjá Ólafi-osk
	 * Býr til element með nafni og bætir við öðrum elementum eða texta nóðum.
	 * @param {string} name Nafn á elementi
	 * @param  {...string | HTMLElement} children Hugsanleg börn: önnur element eða strengir
	 * @returns {HTMLElement} Elementi með gefnum börnum
	 */
	function el(name, attributes = {}, ...children) {
		const e = document.createElement(name);
		for (const key of Object.keys(attributes)) {
			e.setAttribute(key, attributes[key]);
		}
		for (const child of children) {
			if (typeof child === 'string' || typeof child === 'number') {
				e.appendChild(document.createTextNode(child.toString()));
			} else {
				e.appendChild(child);
			}
		}
		return e;
	}

	// 3. UPDATE RENDER FUNCTION to use the 'pixelSize' variable
	function renderPatternPreview(patternMatrix) {
		const previewContainer = document.getElementById('imagePreview');
		if (!previewContainer) return;

		const matrix = typeof patternMatrix === 'string' ? JSON.parse(patternMatrix) : patternMatrix;
		if (!matrix || matrix.length === 0) return;

		const colorPickers = document.querySelectorAll('.color-picker');
		const colorPalette = { 0: 'transparent' };

		if (colorPickers.length > 0) {
			colorPickers.forEach(picker => {
				const index = picker.dataset.colorIndex;
				colorPalette[index] = picker.value;
			});
		} else {
			colorPalette[1] = '#000000'; // Black
			colorPalette[2] = '#6D86E3'; // Blue
			colorPalette[3] = '#E3C46D'; // Yellow
			colorPalette[4] = '#FFFFFF'; // White
		}

		// Use 'pixelSize' variable instead of hardcoded '2' or '2px'
		const newPreview = el('div', {
			id: 'imagePreview',
			style: `
                display: grid;
                grid-template-columns: repeat(${matrix[0].length}, ${pixelSize}px);
                width: ${matrix[0].length * pixelSize}px;
                height: ${matrix.length * pixelSize}px;
                gap: 0;
                max-height: 100%;
                height:fit-content;
                overflow-y: scroll;
                overflow-x: scroll;
                width:fit-content;
                max-width:100%;
                align-content: center;
                align-self:center;
                justify-content:center;
                justify-self:center;
            `,
			class: 'file-list'
		},
			...matrix.flat().map(colorIndex =>
				el('div', {
					class: 'pattern-cell',
					'data-color-index': colorIndex,
					style: `width: ${pixelSize}px; height: ${pixelSize}px; background-color: ${colorPalette[colorIndex]};`
				})
			)
		);
		previewContainer.replaceWith(newPreview);
	}

	document.addEventListener('DOMContentLoaded', async () => {
		const response = await fetch('/api/currentPattern', { method: 'GET' });
		if (!response.ok) { // Check if the response was successful
			alert('Fékk ekki svar frá vefþjónustu.');
			return;
		}
		const data = await response.json();
		if (!data || !data.current) {
			alert('Fann ekkert munstur.');
			return;
		}

		// Store the processed matrix in our global variable
		currentMatrix = recombineColors(data.current);
		// Perform the initial render
		renderPatternPreview(currentMatrix);

		// 4. ADD EVENT LISTENERS for the new buttons
		document.getElementById('zoomIn').addEventListener('click', () => {
			pixelSize++;
			renderPatternPreview(currentMatrix); // Re-render with the new size
		});

		document.getElementById('zoomOut').addEventListener('click', () => {
			if (pixelSize > 1) { // Prevent size from becoming 0 or negative
				pixelSize--;
				renderPatternPreview(currentMatrix); // Re-render with the new size
			}
		});
	});
</script>

</html>
